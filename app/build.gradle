import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.ksp)
}

// versionName is the single source of truth; versionCode = major*10000 + minor*100 + patch
def appVersionName = "2.0.0"
def appVersionCode = {
    def m = (appVersionName =~ /^(\d+)\.(\d+)\.(\d+)$/)
    if (!m.matches()) {
        throw new GradleException("versionName '${appVersionName}' must match MAJOR.MINOR.PATCH (e.g. 2.0.0)")
    }
    def (major, minor, patch) = [m.group(1), m.group(2), m.group(3)].collect { it.toInteger() }
    if (minor > 99 || patch > 99) {
        throw new GradleException("versionName '${appVersionName}': minor and patch must be in 0..99")
    }
    major * 10000 + minor * 100 + patch
}

// Release signing secrets live in the git-ignored keystore.properties; without it, release stays unsigned
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.hidsquid.refreshpaper'
    compileSdk 36

    defaultConfig {
        applicationId "com.hidsquid.refreshpaper"
        minSdk 29
        targetSdk 34
        versionCode appVersionCode()
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
    }
}

dependencies {

    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation libs.core.ktx

    implementation libs.yukihookapi.api
    implementation libs.kavaref.core
    implementation libs.kavaref.extension
    compileOnly libs.xposed.api
    ksp libs.yukihookapi.ksp.xposed
}